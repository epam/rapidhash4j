variables:
  ZIG_VERSION: "0.17.0"
  # SHA-256 of the Linux x86_64 archive. Update together with ZIG_VERSION
  ZIG_SHA256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
  JAVA_VERSION: "17"
  GIT_SUBMODULE_STRATEGY: recursive
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

stages: [native, package]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

default:
  image: "eclipse-temurin:${JAVA_VERSION}-jdk-jammy"
  interruptible: true
  tags:
    - Linux
    - DockerExecutor
    - aws-large

native-build:
  stage: native
  script:
    - test "$(uname -m)" = x86_64
    - apt-get update && apt-get install -y --no-install-recommends curl xz-utils file binutils
    - curl --fail --location --retry 3 --output /tmp/zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
    - printf '%s  /tmp/zig.tar.xz\n' "$ZIG_SHA256" | sha256sum --check
    - tar -xJf /tmp/zig.tar.xz -C /tmp
    - export ZIG="/tmp/zig-x86_64-linux-${ZIG_VERSION}/zig"
    - test "$("$ZIG" version)" = "$ZIG_VERSION"
    - bash scripts/build-natives.sh
    - bash scripts/verify-natives.sh
  artifacts:
    expire_in: 1 week
    paths:
      - build/native-binaries/

package:
  stage: package
  needs: [native-build]
  cache:
    key:
      files: [gradle/wrapper/gradle-wrapper.properties]
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  script:
    - ./gradlew --no-daemon -PnativeBinariesDir=build/native-binaries build generatePomFileForMavenJavaPublication generateMetadataFileForMavenJavaPublication
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/libs/*.jar
      - build/publications/mavenJava/
      - build/reports/tests/
    reports:
      junit:
        - build/test-results/test/*.xml
        - build/test-results/integrationTest/*.xml
